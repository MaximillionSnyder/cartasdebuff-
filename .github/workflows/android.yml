name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          # "tools" ya no existe en el repositorio del SDK (rompe el default).
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      # El keystore de firma vive en los secretos del repo. Con una firma fija
      # `adb install -r` actualiza la app en vez de exigir desinstalarla.
      - name: Preparar firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          CLAVE_ALMACEN: ${{ secrets.KEYSTORE_PASSWORD }}
          CLAVE_ALIAS: ${{ secrets.KEY_ALIAS }}
          CLAVE_CLAVE: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Sin KEYSTORE_BASE64: se firma con el keystore de depuración."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cartasdebuff.jks"
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/cartasdebuff.jks"
            echo "KEYSTORE_PASSWORD=$CLAVE_ALMACEN"
            echo "KEY_ALIAS=$CLAVE_ALIAS"
            echo "KEY_PASSWORD=$CLAVE_CLAVE"
          } >> "$GITHUB_ENV"
          echo "Firma fija preparada."

      - name: Tests unitarios
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Compilar APK debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Compilar APK release
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="0.0.0-$(git rev-parse --short HEAD)"
          fi
          VERSION_NAME="$NAME" VERSION_CODE="$GITHUB_RUN_NUMBER" ./gradlew :app:assembleRelease --stacktrace

      - name: Subir APKs
        uses: actions/upload-artifact@v4
        with:
          name: cartasdebuff-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Adjuntar APK a la release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
